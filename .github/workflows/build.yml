# Public repo Luxaris/gpupool-launcher: when `pool publish` makes a release, build the self-contained Hermes app on
# GitHub-hosted runners and attach the installers to that release. PyInstaller bundles Python + Tkinter; Inno Setup
# (Windows, preinstalled on windows-latest) and hdiutil (macOS) wrap them in a standard installer. No secrets.
# Bridge for v1 ("Run Jobs") apps, which self-update from the old asset names: each installer is also attached
# under its v1 name (the Mac one with the app folder named RunJobs.app, which is what v1 copies out of the .dmg).
# Drop the `legacy` uploads once no v1 installs remain.
name: build
on:
  release:
    types: [published]
permissions:
  contents: write  # attach the installers to the release
jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: windows-latest, asset: Hermes-Setup.exe, legacy: RunJobs-Setup.exe }
          - { os: macos-latest, asset: Hermes-mac-arm64.dmg, legacy: RunJobs-mac-arm64.dmg }
          - { os: macos-15-intel, asset: Hermes-mac-x64.dmg, legacy: RunJobs-mac-x64.dmg }
    runs-on: ${{ matrix.os }}
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: '3.13' }
      - run: pip install pyinstaller
      - name: Tray icon packages (Windows only; on a Mac Hermes uses its Dock icon)
        if: runner.os == 'Windows'
        run: pip install pystray pillow
      - run: pyinstaller --noconfirm --onedir --windowed --name Hermes --hidden-import pystray._win32 gpupool_gui.py
      - name: Windows installer (Inno Setup)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\iscc.exe" "/DAppVersion=$($env:TAG.TrimStart('v'))" "/DSrcDir=$PWD\dist\Hermes" "/DOutDir=$PWD\out" installer\Hermes.iss
          if ($LASTEXITCODE) { exit 1 }
          New-Item -ItemType Directory legacy | Out-Null
          Copy-Item "out\${{ matrix.asset }}" "legacy\${{ matrix.legacy }}"
          gh release upload $env:TAG "out\${{ matrix.asset }}" --clobber
      - name: Mac disk images (hdiutil)
        if: runner.os == 'macOS'
        run: |
          mkdir dmg legacy-app legacy && cp -R dist/Hermes.app dmg/ && cp -R dist/Hermes.app legacy-app/RunJobs.app
          ln -s /Applications dmg/Applications && ln -s /Applications legacy-app/Applications
          hdiutil create -volname "Hermes" -srcfolder dmg -ov -format UDZO "${{ matrix.asset }}"
          hdiutil create -volname "Hermes" -srcfolder legacy-app -ov -format UDZO "legacy/${{ matrix.legacy }}"
          gh release upload "$TAG" "${{ matrix.asset }}" --clobber
      - name: Legacy name for v1 apps (best effort, retried; cannot fail the build)
        continue-on-error: true
        shell: bash
        run: |
          for i in 1 2 3; do gh release upload "$TAG" "legacy/${{ matrix.legacy }}" --clobber && exit 0; sleep $((i * 10)); done
          echo "::warning::could not upload legacy/${{ matrix.legacy }}"
